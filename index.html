<!doctype html>
<!-- No static data-theme/data-flavor: Conjure Health inherits the ConjureOS
     appearance live (see src/theme.ts) rather than locking to one palette.
     Absent attributes fall back to the Conjure default + the browser's
     light/dark preference, which is exactly right pre-JS and standalone —
     src/theme.ts sets real values here at runtime once it knows the host's. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Conjure Health</title>
  </head>
  <body class="cui-ui">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
