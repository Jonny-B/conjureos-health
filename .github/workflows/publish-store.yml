name: Publish to ConjureOS App Store

# Builds Conjure Health to a single self-contained HTML file and publishes a
# new App Store version via the shared composite action in the conjureos repo.
#
# The store slug is `health` (both publish steps below): it is Conjure Health's
# App Store listing. `fitness` is a withdrawn listing, Conjure Health's old one
# under a legacy name; it must never be published to again, from here or by
# hand. The test `scripts/storeSlug.test.mjs` holds both slug lines.
#
# GitHub runs the copy of this file on the branch picked under "Use workflow
# from" (a Release runs the copy at its tag; both default to `main`, the
# default branch). Run it only from a branch whose copy says `slug: health`.
#
# This workflow only adds versions to a listing that exists. A run before the
# listing exists fails with "No existing store app found for slug". The listing
# is created once per project, by hand, with ConjureOS's publish CLI
# (ANCHOR_APP_CI_SETUP.md step 3); a rerun fails, so run it with --dry-run
# first. Build with that project's VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY
# (the values in the build step below) and its SUPABASE_URL, SUPABASE_ANON_KEY,
# PUBLISH_BOT_EMAIL and PUBLISH_BOT_PASSWORD set, then from this repo's root:
#   npm ci && npm run build:inline
#   node <ConjureOS>/scripts/publish-app.mjs --first-publish --featured \
#     --slug health --display-name "Conjure Health" --visibility public \
#     --package-json ./package.json --html dist/index.html \
#     --changelog "Initial version"
# `--featured` is load-bearing: `/launch/health` resolves only for a featured
# row, and only a featured slug is reserved across publishers (ConjureOS
# migration 031). The bot account must be an admin for it to take; the CLI
# prints "Marked featured" when it did.
#
# Two Supabase projects (Phase 24 split), selected by trigger:
#   - workflow_dispatch  -> DEV  project (test against dev.conjureos.pages.dev)
#   - release published  -> PROD project (ships to real users)
#
# Secrets this repo needs (Settings -> Secrets and variables -> Actions). A
# personal account has no shared secrets, so every app repo sets its own:
#   SUPABASE_DEV_PROJECT_REF,  PUBLISH_BOT_DEV_PASSWORD   (dev publishes)
#   SUPABASE_PROD_PROJECT_REF, PUBLISH_BOT_PROD_PASSWORD  (prod publishes)
#   CONJUREOS_REPO_TOKEN  (read-only access to Jonny-B/ConjureOS, see below)
# The URL is built from the project ref; the anon key + bot email are
# public/non-secret and inlined below. See ANCHOR_APP_CI_SETUP.md in the
# conjureos repo.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Which project to publish to
        required: true
        default: dev
        type: choice
        options: [dev, prod]
      changelog:
        description: Changelog for this version
        required: false
        default: ""

concurrency:
  group: publish-store-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm ci

      # Two build steps, gated by trigger, so the bundle bakes the right Supabase
      # URL + anon key for the target project. Anon keys are public by design
      # (shipped in every browser); RLS gates everything. The client SDK needs
      # them to call the health-foods-db Edge Function.
      - name: Build single-file HTML (dev project)
        if: github.event_name == 'workflow_dispatch' && inputs.target != 'prod'
        env:
          VITE_SUPABASE_URL: https://${{ secrets.SUPABASE_DEV_PROJECT_REF }}.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xcHZqbHN5d3JwdGVmZ3d1enRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MTA3OTMsImV4cCI6MjA5NTQ4Njc5M30.ITZjX5KkMNgbJuFEHS5-IqFFJC6A39OynVgOznZeqD8
        run: npm run build:inline

      - name: Build single-file HTML (prod project)
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
        env:
          VITE_SUPABASE_URL: https://${{ secrets.SUPABASE_PROD_PROJECT_REF }}.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50Z2VsYnRlcGVjcXNxbG94bWN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwOTkzMzEsImV4cCI6MjA5MzY3NTMzMX0.fgRCszkeAbHANaK-JJAGmTwWHyOh-3b6-od1c3s3V0w
        run: npm run build:inline

      - name: Resolve changelog
        id: changelog
        # Read release/dispatch text via env vars, NOT ${{ }} interpolation:
        # backticks and quotes in release notes (e.g. `npm packages`) otherwise
        # land in the shell as command substitution and crash with exit 127.
        # Same fix conjureos-app-recipes' workflow took (DECISIONS 2026-06-21).
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_INPUT: ${{ github.event.inputs.changelog }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            text="$RELEASE_BODY"
            [ -z "$text" ] && text="$RELEASE_NAME"
            [ -z "$text" ] && text="$RELEASE_TAG"
          else
            text="$DISPATCH_INPUT"
          fi
          {
            echo "text<<__CHANGELOG__"
            echo "$text"
            echo "__CHANGELOG__"
          } >> "$GITHUB_OUTPUT"

      # The shared publish action lives in the (private) ConjureOS repo. GitHub
      # can't resolve an action in another private *personal* repo via
      # `uses: Jonny-B/ConjureOS/...@dev`, so check ConjureOS out with a
      # read-only PAT and reference the action by local path below.
      - name: Checkout ConjureOS (shared publish action)
        uses: actions/checkout@v4
        with:
          repository: Jonny-B/ConjureOS
          ref: dev
          token: ${{ secrets.CONJUREOS_REPO_TOKEN }}
          path: .conjureos

      # workflow_dispatch -> DEV project. Test path; publishes to dev users.
      - name: Publish to App Store (dev)
        if: github.event_name == 'workflow_dispatch' && inputs.target != 'prod'
        uses: ./.conjureos/.github/actions/publish-anchor-app
        with:
          supabase-url: https://${{ secrets.SUPABASE_DEV_PROJECT_REF }}.supabase.co
          # Anon key is public by design (shipped in every browser); RLS applies.
          supabase-anon-key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xcHZqbHN5d3JwdGVmZ3d1enRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MTA3OTMsImV4cCI6MjA5NTQ4Njc5M30.ITZjX5KkMNgbJuFEHS5-IqFFJC6A39OynVgOznZeqD8
          bot-email: conjureosbot@gmail.com
          bot-password: ${{ secrets.PUBLISH_BOT_DEV_PASSWORD }}
          html-path: dist/index.html
          slug: health
          changelog: ${{ steps.changelog.outputs.text }}

      # release published -> PROD project. Ships to real users.
      - name: Publish to App Store (prod)
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
        uses: ./.conjureos/.github/actions/publish-anchor-app
        with:
          supabase-url: https://${{ secrets.SUPABASE_PROD_PROJECT_REF }}.supabase.co
          supabase-anon-key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50Z2VsYnRlcGVjcXNxbG94bWN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwOTkzMzEsImV4cCI6MjA5MzY3NTMzMX0.fgRCszkeAbHANaK-JJAGmTwWHyOh-3b6-od1c3s3V0w
          bot-email: conjureosbot@gmail.com
          bot-password: ${{ secrets.PUBLISH_BOT_PROD_PASSWORD }}
          html-path: dist/index.html
          slug: health
          changelog: ${{ steps.changelog.outputs.text }}
